<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003262">
<title>Nearest Microwave — UC Berkeley</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --blue: #003262;
    --blue-light: #00538c;
    --gold: #FDB515;
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e6e8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --text: #f2f3f5;
      --muted: #9aa3af;
      --border: #262b33;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--blue-light) 0%, var(--blue) 45%, var(--bg) 46%) fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  main { width: 100%; max-width: 440px; padding-top: 56px; padding-bottom: 40px; }

  .badge {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    margin: 0 auto 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }
  h1 {
    color: white;
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.75);
    font-size: 0.95rem;
    margin: 0 0 28px;
    line-height: 1.4;
  }

  button#go {
    width: 100%;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: var(--gold);
    color: var(--blue);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button#go:active { transform: scale(0.98); }
  button#go:disabled { opacity: 0.7; }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(0,50,98,0.25);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  button#go.loading .spinner { display: inline-block; }
  button#go.loading .btn-label { opacity: 0.8; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
    margin: 14px 0 0;
    min-height: 1.2em;
  }

  #result {
    margin-top: 22px;
    padding: 20px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    display: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #result.show { display: block; opacity: 1; transform: translateY(0); }

  .r-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
  }
  #r-name { margin: 0 0 8px; font-size: 1.2rem; line-height: 1.3; }
  .r-dist-pill {
    display: inline-block;
    background: rgba(0,50,98,0.08);
    color: var(--blue);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  @media (prefers-color-scheme: dark) {
    .r-dist-pill { background: rgba(253,181,21,0.15); color: var(--gold); }
  }
  #r-notes {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  #r-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 13px;
    background: var(--blue);
    color: white;
    text-decoration: none;
    font-weight: 600;
    border-radius: 12px;
    font-size: 0.95rem;
  }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem;
    margin-top: 32px;
  }
  @media (prefers-color-scheme: dark) { footer { color: var(--muted); } }

  #map {
    height: 260px;
    border-radius: 16px;
    margin: 20px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    border: 1px solid var(--border);
  }
  .you-pin {
    width: 16px; height: 16px; border-radius: 50%;
    background: #2563eb; border: 3px solid white;
    box-shadow: 0 0 0 2px #2563eb, 0 2px 6px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<main>
  <div class="badge">🔥</div>
  <h1>Nearest Microwave</h1>
  <p class="subtitle">Finds the closest microwave to you on the UC&nbsp;Berkeley campus.</p>

  <div id="map"></div>

  <button id="go">
    <span class="spinner"></span>
    <span class="btn-label">Find nearest microwave</span>
  </button>
  <p id="status"></p>

  <div id="result">
    <p class="r-eyebrow">Closest to you</p>
    <h2 id="r-name"></h2>
    <span class="r-dist-pill" id="r-dist"></span>
    <p id="r-notes"></p>
    <a id="r-link" target="_blank" rel="noopener">Walking directions →</a>
  </div>

  <footer>Data: food.berkeley.edu foodscape map</footer>
</main>

<script>
// ponytail: hardcoded snapshot from food.berkeley.edu/foodscape-map (selfservice.geojson, Type=microwave), pulled 2026-08-11.
// Re-fetch that feed and filter Type==="microwave" if the campus map adds/moves locations.
const MICROWAVES = [
  { name: "Common Grounds Microwave", lat: 37.8706313, lon: -122.2607799, notes: "Top floor of Dwinelle Hall" },
  { name: "Cory Hall Microwave", lat: 37.875139, lon: -122.257422, notes: "In TeaOne Cafe" },
  { name: "Davis Hall Microwave", lat: 37.8746332, lon: -122.2581178, notes: "In room 602" },
  { name: "Foothill Student Housing 6 Microwave", lat: 37.8753488, lon: -122.2549742, notes: "In dining hall TV room" },
  { name: "Golden Bear Cafe Microwave", lat: 37.869847, lon: -122.259739, notes: "Inside Golden Bear Cafe" },
  { name: "Haas School of Business Microwave", lat: 37.8716225, lon: -122.2535004, notes: "In room F371" },
  { name: "Physics South and Physics North Microwaves", lat: 37.872817, lon: -122.257466, notes: "In lounge/break area next to room 402" },
  { name: "Soda Hall Microwave", lat: 37.8756495, lon: -122.2586918, notes: "Room 311 CSUA, room 562 Cafe Diem, room 678 kitchen, room 728 kitchen" },
  { name: "Basic Needs Center Microwave", lat: 37.8692299, lon: -122.2596788, notes: "Basement of MLK Jr. Student Union (bNorth), in kitchen. Need Cal 1 ID" },
  { name: "Terrace Cafe Microwave", lat: 37.874203, lon: -122.25842, notes: "Inside Terrace Cafe" },
  { name: "The Pro Shop Microwave", lat: 37.868745, lon: -122.2626574, notes: "Inside the Pro Shop at Recreational Sports Facility" },
  { name: "Transfer Center Microwave", lat: 37.8696978, lon: -122.2602582, notes: "Next to Cal 1 Card Office" },
  { name: "Valley Life Sciences Building Microwave", lat: 37.871513, lon: -122.261768, notes: "In Micro Yali's cafe; pay 50 cents to use" },
];

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

const btn = document.getElementById('go');
const status = document.getElementById('status');
const result = document.getElementById('result');

// map center: centroid of the 13 microwave points
const CENTER = [
  MICROWAVES.reduce((s, m) => s + m.lat, 0) / MICROWAVES.length,
  MICROWAVES.reduce((s, m) => s + m.lon, 0) / MICROWAVES.length,
];

let map, markers = {}, youMarker, youIcon;

function initMap() {
  map = L.map('map', { zoomControl: false }).setView(CENTER, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  for (const m of MICROWAVES) {
    const marker = L.marker([m.lat, m.lon]).addTo(map)
      .bindPopup(`<strong>${m.name}</strong><br>${m.notes}`);
    markers[m.name] = marker;
  }

  youIcon = L.divIcon({ className: '', html: '<div class="you-pin"></div>', iconSize: [16, 16] });
}

btn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    status.textContent = "Geolocation isn't supported on this browser.";
    return;
  }
  btn.disabled = true;
  btn.classList.add('loading');
  status.textContent = "Locating you…";
  result.classList.remove('show');

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    let nearest = null, best = Infinity;
    for (const m of MICROWAVES) {
      const d = haversineMeters(latitude, longitude, m.lat, m.lon);
      if (d < best) { best = d; nearest = m; }
    }
    document.getElementById('r-name').textContent = nearest.name;
    document.getElementById('r-notes').textContent = nearest.notes;
    document.getElementById('r-dist').textContent = `${Math.round(best)} m · ${(best / 1609.34).toFixed(2)} mi`;
    document.getElementById('r-link').href =
      `https://www.google.com/maps/dir/?api=1&destination=${nearest.lat},${nearest.lon}&travelmode=walking`;
    result.style.display = 'block';
    requestAnimationFrame(() => result.classList.add('show'));
    status.textContent = '';
    btn.disabled = false;
    btn.classList.remove('loading');

    if (youMarker) youMarker.setLatLng([latitude, longitude]);
    else youMarker = L.marker([latitude, longitude], { icon: youIcon }).addTo(map).bindPopup('You are here');
    map.fitBounds([[latitude, longitude], [nearest.lat, nearest.lon]], { padding: [40, 40], maxZoom: 17 });
    markers[nearest.name].openPopup();
  }, err => {
    status.textContent = "Couldn't get your location: " + err.message;
    btn.disabled = false;
    btn.classList.remove('loading');
  }, { enableHighAccuracy: true, timeout: 10000 });
});

window.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
