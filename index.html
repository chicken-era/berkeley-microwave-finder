<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nearest Microwave — UC Berkeley</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px 16px; background: #fafafa; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  button { width: 100%; padding: 14px; font-size: 1.05rem; border: none; border-radius: 10px; background: #003262; color: white; }
  button:disabled { opacity: 0.5; }
  #result { margin-top: 20px; padding: 16px; border-radius: 10px; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: none; }
  #result h2 { margin: 0 0 4px; font-size: 1.15rem; }
  #result p { margin: 4px 0; color: #444; }
  #result a { display: inline-block; margin-top: 10px; color: #003262; font-weight: 600; }
  #status { color: #666; margin-top: 12px; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>🔥 Nearest Microwave</h1>
<p>Finds the closest microwave to you on the UC Berkeley campus.</p>
<button id="go">Find nearest microwave</button>
<p id="status"></p>
<div id="result">
  <h2 id="r-name"></h2>
  <p id="r-notes"></p>
  <p id="r-dist"></p>
  <a id="r-link" target="_blank" rel="noopener">Open walking directions →</a>
</div>

<script>
// ponytail: hardcoded snapshot from food.berkeley.edu/foodscape-map (selfservice.geojson, Type=microwave), pulled 2026-08-11.
// Re-fetch that feed and filter Type==="microwave" if the campus map adds/moves locations.
const MICROWAVES = [
  { name: "Common Grounds Microwave", lat: 37.8706313, lon: -122.2607799, notes: "Top floor of Dwinelle Hall" },
  { name: "Cory Hall Microwave", lat: 37.875139, lon: -122.257422, notes: "In TeaOne Cafe" },
  { name: "Davis Hall Microwave", lat: 37.8746332, lon: -122.2581178, notes: "In room 602" },
  { name: "Foothill Student Housing 6 Microwave", lat: 37.8753488, lon: -122.2549742, notes: "In dining hall TV room" },
  { name: "Golden Bear Cafe Microwave", lat: 37.869847, lon: -122.259739, notes: "Inside Golden Bear Cafe" },
  { name: "Haas School of Business Microwave", lat: 37.8716225, lon: -122.2535004, notes: "In room F371" },
  { name: "Physics South and Physics North Microwaves", lat: 37.872817, lon: -122.257466, notes: "In lounge/break area next to room 402" },
  { name: "Soda Hall Microwave", lat: 37.8756495, lon: -122.2586918, notes: "Room 311 CSUA, room 562 Cafe Diem, room 678 kitchen, room 728 kitchen" },
  { name: "Basic Needs Center Microwave", lat: 37.8692299, lon: -122.2596788, notes: "Basement of MLK Jr. Student Union (bNorth), in kitchen. Need Cal 1 ID" },
  { name: "Terrace Cafe Microwave", lat: 37.874203, lon: -122.25842, notes: "Inside Terrace Cafe" },
  { name: "The Pro Shop Microwave", lat: 37.868745, lon: -122.2626574, notes: "Inside the Pro Shop at Recreational Sports Facility" },
  { name: "Transfer Center Microwave", lat: 37.8696978, lon: -122.2602582, notes: "Next to Cal 1 Card Office" },
  { name: "Valley Life Sciences Building Microwave", lat: 37.871513, lon: -122.261768, notes: "In Micro Yali's cafe; pay 50 cents to use" },
];

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

document.getElementById('go').addEventListener('click', () => {
  const status = document.getElementById('status');
  const btn = document.getElementById('go');
  if (!navigator.geolocation) {
    status.textContent = "Geolocation isn't supported on this browser.";
    return;
  }
  btn.disabled = true;
  status.textContent = "Locating you…";

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    let nearest = null, best = Infinity;
    for (const m of MICROWAVES) {
      const d = haversineMeters(latitude, longitude, m.lat, m.lon);
      if (d < best) { best = d; nearest = m; }
    }
    document.getElementById('r-name').textContent = nearest.name;
    document.getElementById('r-notes').textContent = nearest.notes;
    document.getElementById('r-dist').textContent = `${Math.round(best)} m away (${(best / 1609.34).toFixed(2)} mi)`;
    document.getElementById('r-link').href =
      `https://www.google.com/maps/dir/?api=1&destination=${nearest.lat},${nearest.lon}&travelmode=walking`;
    document.getElementById('result').style.display = 'block';
    status.textContent = '';
    btn.disabled = false;
  }, err => {
    status.textContent = "Couldn't get your location: " + err.message;
    btn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 10000 });
});
</script>
</body>
</html>
